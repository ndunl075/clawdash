name: Windows release candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/check-licenses.mjs
      - run: node scripts/build-sidecar.mjs
      - run: node scripts/smoke-sidecar.mjs
      - run: pnpm --dir apps/desktop build
      - run: ./scripts/smoke-installer.ps1
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clawdash-windows-candidate
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            dist/SHA256SUMS.txt
      # A real clean-VM install/auto-open/uninstall review remains a release gate.
